<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1716"><title>Soccer Sunday — Kick your RSVP</title><style>
*{box-sizing:border-box}body{margin:0;background:#091412;color:#f1f6ef;font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header{max-width:1400px;margin:auto;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-weight:900;letter-spacing:-1px;font-size:22px}.brand span{color:#bdff57}.pill{font-size:11px;letter-spacing:2px;color:#b4c4ba}nav{display:flex;gap:8px}button{border:1px solid #ffffff24;border-radius:50px;padding:12px 20px;color:inherit;background:#ffffff09;font-weight:650}button:hover{background:#ffffff1c}button:focus-visible,a:focus-visible{outline:3px solid #bdff57;outline-offset:3px}.active,.primary{background:#bdff57!important;color:#10200b!important;border-color:#bdff57}main{max-width:1400px;margin:auto;padding:38px 5%}.eyebrow{font-size:11px;letter-spacing:3px;color:#bdff57;font-weight:750}h1{font-size:clamp(46px,6.5vw,91px);line-height:.99;letter-spacing:-.065em;margin:18px 0 24px}h1 em{font-style:normal;color:#bdff57}h2{font-size:clamp(32px,4.4vw,60px);letter-spacing:-.045em;line-height:1.04;margin:20px 0}p{color:#adc0b5;line-height:1.65} .layout{display:block;max-width:850px;margin:0 auto}.customize-area{max-width:850px;margin:20px auto 0}.customize-area details{max-width:100%}.customize-area summary{text-align:center}.customize-area details>div{max-width:420px;margin:15px auto 0!important}.intro p{max-width:420px;font-size:17px}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.tag{border:1px solid #ffffff20;padding:8px 12px;border-radius:8px;font-size:11px;color:#b9c8be}.game{background:#12241e;border:1px solid #ffffff22;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px #0007}.gamehead{padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.gamehead strong{display:block;font-size:15px}.gamehead small{font-size:11px;color:#a9bcb0}.live{color:#bdff57;font-size:10px;letter-spacing:2px}canvas{display:block;width:100%;aspect-ratio:8/5;touch-action:pan-y;background:#153c2a}.controls{padding:17px 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.no{background:#422a2e}.yes{background:#bdff57;color:#11200b}.hint{text-align:center;color:#a8bbaf;font-size:11px;margin:12px 0 0}.result{display:none;padding:0 20px 20px}.result.show{display:block}.result .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch;margin-top:13px;text-align:center}.result button{font-size:12px;padding:12px 7px;min-height:52px;min-width:0;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.35}.result button:first-child{justify-self:start;width:100%}.result button:last-child{justify-self:end;width:100%}.result{text-align:center}.status{text-align:center}button:disabled{cursor:default;opacity:.65}canvas{user-select:none;-webkit-user-select:none}.status{font-size:12px;color:#c1cfc5;margin:10px 0 0;min-height:18px}.smallprint{font-size:11px;line-height:1.6;color:#8ea596}.below{margin-top:40px;border-top:1px solid #ffffff20;padding-top:22px;display:flex;justify-content:space-between;gap:30px}.below p{font-size:12px;margin:0;max-width:600px}label{font-size:12px;color:#a9bcb0}input{background:#ffffff09;border:1px solid #ffffff22;border-radius:10px;padding:11px;color:white;width:100%;margin:6px 0 12px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.customize{margin-top:24px}details summary{cursor:pointer;font-size:13px;color:#d4dfd7}details{max-width:420px}footer{padding:20px 5%;font-size:10px;color:#769082}@media(max-width:850px){header{padding:17px 5%}.pill{display:none}nav button{font-size:12px;padding:10px 13px}.layout{grid-template-columns:1fr;gap:25px}main{padding-top:25px}h1{font-size:57px;max-width:500px}.intro p{font-size:15px}.tags{margin:18px 0}.below{flex-direction:column;gap:12px}.gamehead{padding:14px 17px}}
</style></head><body><header><div class="brand">sunday<span>fc.</span></div><div class="pill">KICK YOUR RSVP</div></header><main><section id="play"><div class="layout"><div class="game"><div class="gamehead"><div><strong id="eventtitle">Soccer Sunday at 1pm</strong><small>Who’s all in? Kick your RSVP.</small></div><span class="live">● MATCH DAY</span></div><canvas id="pitch" width="960" height="600" aria-label="Penalty kick game. Swipe right for yes or left for no. Buttons below offer the same controls."></canvas><div class="controls"><div class="choices"><button class="no" id="nobtn">← No, sitting out</button><button class="yes" id="yesbtn">Yes, I’m in →</button></div><p class="hint" id="hint">Click button or swipe to respond.</p></div><div id="result" class="result"><div class="actions"><button id="again">Take another shot ↺</button><button class="primary" id="share">Shot Results ↗</button><button id="pass">Next Shooter ↗</button></div><p id="status" class="status" role="status" aria-live="polite"></p></div></div></div><div class="customize-area"><details class="customize"><summary>Make the invitation yours</summary><div style="margin-top:15px"><label>Your name<input id="name" maxlength="24" value="" placeholder="Your name"></label><label>Invitation<input id="event" maxlength="70" value="Soccer Sunday at 1pm"></label><button id="apply">Update invitation</button></div></details></div></section></main><footer>SUNDAY FC · Pick your answer. Share your highlight.</footer><script>'use strict';
const $=id=>document.getElementById(id), canvas=$('pitch'),ctx=canvas.getContext('2d');let choice=null,started=0,playing=false,lastChoice=null,gif=null,exporting=false,exportJob=null,playerName='Player',eventName='Soccer Sunday at 1pm';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>1-Math.pow(1-clamp(v),3);
function line(c,x,y,xx,yy,col,w=2){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke()}
function ellipse(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function person(c,x,y,s,keeper,pose,t){c.save();c.translate(x,y);c.scale(s,s);if(keeper&&pose==='dive')c.rotate(-1.1);const win=pose==='win',kick=pose==='kick';ellipse(c,0,8,25,6,'#0005');const skin='#c78d60',shirt=keeper?'#ffc342':'#d3ff66';line(c,-8,-41,-12,0,'#162629',13);line(c,8,-41,kick?40:15,kick?-28:0,'#162629',13);line(c,-12,-2,-21,1,'#f4f5df',8);line(c,kick?40:15,kick?-28:0,kick?48:24,kick?-25:2,'#f4f5df',8);c.fillStyle=shirt;c.beginPath();c.moveTo(-19,-84);c.lineTo(19,-84);c.lineTo(14,-40);c.lineTo(-14,-40);c.closePath();c.fill();line(c,-18,-77,win?-34:-34,win?-116:-48,shirt,12);line(c,18,-77,win?34:35,win?-116:-52,shirt,12);ellipse(c,win?-34:-34,win?-118:-47,6,7,keeper?'#f2f4df':skin);ellipse(c,win?34:35,win?-118:-51,6,7,keeper?'#f2f4df':skin);ellipse(c,0,-101,13,16,skin);ellipse(c,0,-113,13,6,'#252325');if(!keeper){c.fillStyle='#17291b';c.font='bold 22px sans-serif';c.textAlign='center';c.fillText('7',0,-57)}c.restore()}
function ball(c,x,y,r,t){ellipse(c,x,y+3,r*1.2,r*.35,'#0005');ellipse(c,x,y-r,r,r,'#fff8df');c.save();c.translate(x,y-r);c.rotate(t*7);c.fillStyle='#17282c';c.beginPath();for(let i=0;i<5;i++){let a=i*Math.PI*2/5;c.lineTo(Math.cos(a)*r*.45,Math.sin(a)*r*.45)}c.closePath();c.fill();for(let i=0;i<5;i++){let a=i*Math.PI*2/5;line(c,Math.cos(a)*r*.5,Math.sin(a)*r*.5,Math.cos(a)*r*.95,Math.sin(a)*r*.95,'#243a36',Math.max(1,r*.12))}c.restore()}
function render(c,time,answer){const W=960,H=600;c.save();c.scale(c.canvas.width/W,c.canvas.height/H);const sky=c.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#0c1b25');sky.addColorStop(.4,'#27464a');sky.addColorStop(1,'#19532e');c.fillStyle=sky;c.fillRect(0,0,W,H);
// Stadium bowl, illuminated crowd, floodlights.
c.fillStyle='#14272a';c.beginPath();c.moveTo(0,85);c.quadraticCurveTo(480,210,960,85);c.lineTo(960,260);c.lineTo(0,260);c.fill();for(let row=0;row<7;row++)for(let j=0;j<80;j++){const x=j*13+(row%2)*5,y=122+row*17+Math.sin(j/80*Math.PI)*34;ellipse(c,x,y,2.5,2,['#d1dabb','#6e9385','#354b52','#c5ad6f'][(j*17+row*3)%4])}line(c,0,245,960,245,'#baff5e',4);for(const x of [90,870]){line(c,x,10,x,110,'#ffffff30',3);c.fillStyle='#e9ffe1';c.fillRect(x-40,10,80,7);const g=c.createRadialGradient(x,20,5,x,20,150);g.addColorStop(0,'#e6ffd52b');g.addColorStop(1,'#e6ffd500');c.fillStyle=g;c.fillRect(x-150,0,300,210)}
c.fillStyle='#225d37';c.fillRect(0,260,960,340);for(let i=0;i<7;i++){c.fillStyle=i%2?'#ffffff06':'#00000006';c.fillRect(0,260+i*49,960,49)}line(c,150,600,300,275,'#dcecd98a',3);line(c,810,600,660,275,'#dcecd98a',3);line(c,225,440,735,440,'#dcecd9a0',3);line(c,225,440,320,280,'#dcecd980',3);line(c,735,440,640,280,'#dcecd980',3);ellipse(c,480,490,5,2,'#eef6d9');
// Goal cage and net.
c.fillStyle='#071d1a66';c.fillRect(316,183,328,125);for(let x=318;x<645;x+=18)line(c,x,185,x,307,'#e6ffff35',1);for(let y=185;y<309;y+=16)line(c,316,y,644,y,'#e6ffff35',1);line(c,304,305,304,176,'#f3ffea',7);line(c,304,176,656,176,'#f3ffea',7);line(c,656,176,656,305,'#f3ffea',7);line(c,304,176,316,184,'#c2d7c9',3);line(c,656,176,644,184,'#c2d7c9',3);
const flight=ease((time-.7)/.85),after=time>1.65;let gx=480,gy=302,gs=.75,gpose='idle';if(time>.9){gx=480-(answer==='yes'?100:115)*ease((time-.9)/.55);gy=302+20*ease((time-.9)/.55);gpose='dive'}if(after&&answer==='no'){gx=375;gy=305;gpose='win';gy-=Math.abs(Math.sin((time-1.65)*6))*6}person(c,gx,gy,gs,true,gpose,time);
let px=441+18*ease(time/.65),py=548-40*ease(time/.65);const pwin=after&&answer==='yes';if(pwin){px=450+Math.sin(time*5)*9;py=510-Math.abs(Math.sin(time*5))*15}person(c,px,py,1.7,false,pwin?'win':(time>.55&&time<1.15?'kick':'idle'),time);
let bx=494,by=515,br=17;if(time>.7){bx=494+(answer==='yes'?124:-115)*flight;by=515-265*flight-Math.sin(flight*Math.PI)*55;br=17-10*flight}if(after&&answer==='no'){bx=379+80*ease((time-1.55)/1);by=270+170*ease((time-1.55)/1);br=9+5*ease((time-1.55)/1)}ball(c,bx,by,br,time);
// Broadcast graphics.
c.fillStyle='#0b171be0';c.fillRect(28,25,180,39);c.fillStyle='#bdff57';c.fillRect(28,25,5,39);c.fillStyle='#eef5ed';c.font='bold 14px sans-serif';c.textAlign='left';c.fillText('SUNDAY FC  /  RSVP',46,50);c.textAlign='right';c.fillStyle='#ffffffaa';c.font='12px sans-serif';c.fillText('PENALTY CAM',930,48);
if(after){const yes=answer==='yes';c.fillStyle='#0a1717ed';c.fillRect(130,348,700,116);c.fillStyle=yes?'#bdff57':'#ffca81';c.fillRect(130,348,6,116);c.textAlign='center';c.font='900 43px sans-serif';c.fillStyle=yes?'#bdff57':'#ffca81';c.fillText(yes?'YES — I’M IN!':'NO — SITTING OUT',480,400);c.font='18px sans-serif';c.fillStyle='#e8f0e4';c.fillText(playerName+' · '+eventName,480,437,650);if(yes)for(let i=0;i<42;i++){const xx=(i*137+time*30)%960,yy=(i*53+(time-1.65)*110)%500;c.fillStyle=['#bdff57','#fff5cc','#91d9ed'][i%3];c.fillRect(xx,yy,5,10)}}else if(!answer){c.textAlign='center';c.font='bold 20px sans-serif';c.fillStyle='#f5ffe6';c.fillText('YOUR ANSWER. YOUR HIGHLIGHT.',480,577)}c.restore()}
function tick(now){let t=playing?(now-started)/1000:(choice?3.6:0);render(ctx,t,choice);if(playing&&t>=3.6){playing=false;$('yesbtn').disabled=$('nobtn').disabled=false;render(ctx,3.6,choice);$('result').classList.add('show');$('hint').textContent='Click button or swipe to respond.';$('status').textContent='Creating your animated GIF…';createGIF().then(()=>{$('status').textContent='GIF ready. Choose your chat from the share sheet.'}).catch(()=>{$('status').textContent='GIF export failed. Take another shot to retry.'})}requestAnimationFrame(tick)}
function shoot(answer){if(playing||exporting)return;choice=answer;lastChoice=answer;gif=null;exportJob=null;started=performance.now();playing=true;$('result').classList.remove('show');$('yesbtn').disabled=$('nobtn').disabled=true;$('hint').textContent=answer==='yes'?'YES locked in. Send it top corner.':'NO locked in. The keeper has this one.';}
function reset(){if(exporting)return;choice=null;gif=null;$('yesbtn').disabled=$('nobtn').disabled=false;$('result').classList.remove('show');$('hint').textContent='Click button or swipe to respond.';}
$('yesbtn').onclick=()=>shoot('yes');$('nobtn').onclick=()=>shoot('no');$('again').onclick=reset;let down=null;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)>Math.max(24,Math.min(45,canvas.getBoundingClientRect().width*.1))&&Math.abs(dx)>Math.abs(dy)*1.2)shoot(dx>0?'yes':'no');down=null});canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('lostpointercapture',()=>down=null);
$('apply').onclick=()=>{if(playing||exporting)return;playerName=$('name').value.trim()||'Player';eventName=$('event').value.trim()||'Soccer Sunday at 1pm';$('eventtitle').textContent=eventName;reset()};
// GIF89a encoder: fixed 256-color palette; clear dictionary every 200 literals.
function createGIF(){if(gif)return Promise.resolve(gif);if(exportJob)return exportJob;exportJob=encodeGIF();return exportJob}
async function encodeGIF(){exporting=true;try{const w=384,h=240,parts=[],push=a=>parts.push(new Uint8Array(a)),str=s=>push([...s].map(c=>c.charCodeAt(0))),u16=n=>[n&255,n>>8];str('GIF89a');push([...u16(w),...u16(h),247,0,0]);const pal=[];for(let i=0;i<256;i++)pal.push(Math.round(((i>>5)&7)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));push(pal);push([33,255,11]);str('NETSCAPE2.0');push([3,1,0,0,0]);const off=document.createElement('canvas');off.width=w;off.height=h;const c=off.getContext('2d',{willReadFrequently:true});for(let f=0;f<40;f++){render(c,f/10,lastChoice);const rgba=c.getImageData(0,0,w,h).data,codes=[256];for(let i=0;i<w*h;i++){if(i&&i%200===0)codes.push(256);codes.push((rgba[i*4]>>5)<<5|(rgba[i*4+1]>>5)<<2|(rgba[i*4+2]>>6))}codes.push(257);let acc=0,bits=0;const bytes=[];for(const code of codes){acc|=code<<bits;bits+=9;while(bits>=8){bytes.push(acc&255);acc>>>=8;bits-=8}}if(bits)bytes.push(acc&255);push([33,249,4,0,10,0,0,0,44,0,0,0,0,...u16(w),...u16(h),0,8]);for(let j=0;j<bytes.length;j+=255){const sub=bytes.slice(j,j+255);push([sub.length,...sub])}push([0]);if(f%4===0)await new Promise(r=>setTimeout(r,0))}push([59]);gif=new Blob(parts,{type:'image/gif'});return gif}finally{exporting=false}}
function reply(){return `${playerName}: ${lastChoice==='yes'?'YES — I’m in! ⚽':'NO — sitting out 🧤'} ${eventName}.`}
function downloadBlob(b){const a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='soccer-sunday-'+lastChoice+'.gif';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('share').onclick=async()=>{if(!gif){$('status').textContent='GIF is still rendering. Tap Share again when ready.';return}const file=new File([gif],'soccer-sunday-'+lastChoice+'.gif',{type:'image/gif'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Soccer Sunday',text:reply()});$('status').textContent='Share sheet closed. Delivery is handled by your messaging app.'}else{downloadBlob(gif);$('status').textContent='File sharing unavailable here. GIF downloaded; attach it in the group.'}}catch(e){$('status').textContent=e.name==='AbortError'?'Sharing canceled. Your GIF is still ready.':'Sharing unavailable in this browser. Try Shot Results in Safari or Chrome.'}};
function invitationURL(){if(location.protocol==='file:')return null;const url=new URL(location.href);url.hash='';url.search='';url.searchParams.set('event',eventName);return url.href}
$('pass').onclick=async()=>{const url=invitationURL();if(!url){$('status').textContent='Publish this page on a web host to share a game link. Your GIF can still be downloaded.';return}try{if(navigator.share){await navigator.share({title:eventName,text:'You’re up! Swipe right for YES or left for NO. '+eventName,url});$('status').textContent='Share sheet closed. The next shooter opens a fresh game.'}else{await navigator.clipboard.writeText(url);$('status').textContent='Game link copied. Paste it into your group chat.'}}catch(e){$('status').textContent=e.name==='AbortError'?'Sharing canceled. The game link is still ready.':'Could not share the link. Copy this address: '+url}};
const incomingEvent=new URL(location.href).searchParams.get('event');if(incomingEvent){eventName=incomingEvent.slice(0,70);$('eventtitle').textContent=eventName;$('event').value=eventName;playerName='Player';$('name').value=''}
document.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return; if(e.key==='ArrowRight'){e.preventDefault();shoot('yes')} if(e.key==='ArrowLeft'){e.preventDefault();shoot('no')} }); requestAnimationFrame(tick);
</script></body></html>
